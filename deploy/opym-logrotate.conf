# Rotation for the opym/naparym service logs (no root needed): run by
# opym-logrotate.service/.timer, which substitutes @HOME@. The services log
# with StandardOutput=append:, i.e. O_APPEND, so copytruncate is safe: after
# the truncate their next write lands at the new end of the file.
# Added 2026-10-10, when opym-backfill.log had reached 271 MB and
# opym-serve.log 150 MB.
@HOME@/projects/science/bioimaging/logs/opym-*.log
@HOME@/projects/science/bioimaging/logs/rig/*.log
@HOME@/.local/state/opym-viewer/viewer.log
@HOME@/.local/state/naparym-live/host.log
{
    size 50M
    rotate 4
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
