[project]
name = "bioimaging"
version = "0.3.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "imageio[ffmpeg]>=2.36",
    "ipyfilechooser>=0.6.0",
    "ipywidgets>=8.1.8",
    "matlabengine==24.2.*",
    "matplotlib>=3.10.9",
    "napari[all]>=0.7.0",
    "napari-ome-zarr<0.7",
    "ndv[qt,vispy]>=0.5.0",
    "opym[server]",
    "pypetakit5d>=1.4.6",
    "pyqt6-webengine>=6.11.0",
    "tifffile<2024.8.10",
    "torch>=2.11.0",
    "zarr<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
  "run_backfill_cli.py",
  "psf_tools/",
  "backfill/",
]

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cuda" }]
torchvision = [{ index = "pytorch-cuda" }]
opym = { path = "../opym_local", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a GPU (deselect with -m 'not gpu')"]
# Belt and braces: probes and scratch scripts must never be collected.
norecursedirs = ["scripts", "scratch", "matlab_legacy", "data", ".venv"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    # ome_types.from_xml(validate=True): OME-XML schema checks in opym's tests.
    "xmlschema>=3",
]

[project.scripts]
# opym owns `opym`, `opym-serve`, `opym-receive`, `opym-receive-backfill`, `opym-backfill-send`,
# `opym-stream-watch`, `opym-live-trace` (opym's pyproject); the names keep resolving here because
# opym[server] is installed. Only bioimaging's own scripts are declared below.
opym-backfill = "run_backfill_cli:main"
opym-storage-triage = "backfill.storage_triage.cli:main"
