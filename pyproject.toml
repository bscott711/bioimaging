[project]
name = "bioimaging"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipyfilechooser>=0.6.0",
    "ipywidgets>=8.1.8",
    "matlabengine==24.2.*",
    "matplotlib>=3.10.9",
    "napari[all]>=0.7.0",
    "ndv[qt,vispy]>=0.5.0",
    "opym",
    "pypetakit5d>=1.4.6",
    "pyqt6-webengine>=6.11.0",
    "tifffile<2024.8.10",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "zarr<3",
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cuda" }]
torchvision = [{ index = "pytorch-cuda" }]
opym = { path = "../opym_local", editable = true }
